<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4f0" />
    <meta
      name="description"
      content="YourName 的个人作品集：项目、经历、荣誉与技能。"
    />
    <title>YourName · Personal Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <video
        class="scrub-video"
        id="scrub-video"
        muted
        playsinline
        preload="metadata"
        aria-hidden="true"
      >
        <source src="./assets/e61eeb25d63f48659a799332d21d1e7d.mp4" type="video/mp4" />
      </video>
      <div class="video-tint" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="site-header">
        <a class="brand" href="#top" aria-label="回到首页">
          <span>YourName</span><span class="brand-mark">✳︎</span>
        </a>

        <nav class="desktop-nav" aria-label="主导航">
          <a href="#top">首页</a>
          <a href="#modal-anchor" data-open-modal="projects">项目</a>
          <a href="#modal-anchor" data-open-modal="experience">经历</a>
          <a href="#modal-anchor" data-open-modal="life">生活</a>
        </nav>

        <a class="header-contact" href="mailto:hello@example.com">
          联系我 <span aria-hidden="true">↗</span>
        </a>

        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </header>

      <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
        <a href="#top">首页</a>
        <a href="#modal-anchor" data-open-modal="projects">项目</a>
        <a href="#modal-anchor" data-open-modal="experience">经历</a>
        <a href="#modal-anchor" data-open-modal="life">生活</a>
        <a href="mailto:hello@example.com">联系我 ↗</a>
      </div>

      <main id="top" class="hero">
        <div class="hero-copy">
          <p class="eyebrow">HELLO, I'M</p>
          <h1>你好，我是<br /><em>YourName.</em></h1>
          <p class="hero-description">
            设计产品，编写代码，<br />也记录生活。
          </p>
          <div class="hero-meta">
            <span>PRODUCT · CODE · LIFE</span>
            <span class="meta-line"></span>
            <span>SCROLL TO EXPLORE</span>
          </div>
        </div>

        <div class="ticket-dock" id="ticket-dock" aria-label="作品集目录">
          <button class="ticket ticket-red" data-ticket="projects" data-depth="1.2" type="button">
            <span class="ticket-number">01</span>
            <span class="ticket-title">项目经历</span>
            <span class="ticket-subtitle">PROJECTS</span>
            <span class="ticket-note">从想法到落地的作品集</span>
            <span class="ticket-arrow" aria-hidden="true">↗</span>
            <span class="barcode" aria-hidden="true"></span>
            <span class="ticket-dots" aria-hidden="true">⋮<br />⋮</span>
          </button>

          <button class="ticket ticket-blue" data-ticket="experience" data-depth="0.8" type="button">
            <span class="ticket-number">02</span>
            <span class="ticket-title">工作经历</span>
            <span class="ticket-subtitle">EXPERIENCE</span>
            <span class="ticket-note">在实践中持续成长</span>
            <span class="ticket-arrow" aria-hidden="true">↗</span>
            <span class="barcode" aria-hidden="true"></span>
            <span class="ticket-dots" aria-hidden="true">⋮<br />⋮</span>
          </button>

          <button class="ticket ticket-orange" data-ticket="awards" data-depth="1" type="button">
            <span class="ticket-number">03</span>
            <span class="ticket-title">奖项荣誉</span>
            <span class="ticket-subtitle">AWARDS</span>
            <span class="ticket-note">重要的认可与里程碑</span>
            <span class="ticket-arrow" aria-hidden="true">↗</span>
            <span class="barcode" aria-hidden="true"></span>
            <span class="ticket-dots" aria-hidden="true">⋮<br />⋮</span>
          </button>

          <button class="ticket ticket-green" data-ticket="skills" data-depth="0.7" type="button">
            <span class="ticket-number">04</span>
            <span class="ticket-title">技能工具</span>
            <span class="ticket-subtitle">SKILLS</span>
            <span class="ticket-note">我常用的工具与技术</span>
            <span class="ticket-arrow" aria-hidden="true">↗</span>
            <span class="barcode" aria-hidden="true"></span>
            <span class="ticket-dots" aria-hidden="true">⋮<br />⋮</span>
          </button>
        </div>

        <div class="hero-aside" aria-hidden="true">
          <span class="aside-spark">✦</span>
          <p>保持好奇<br />持续创造<br />让想法发生 <span>♡</span></p>
          <div class="aside-arrow">↗</div>
        </div>

        <div class="hero-footer">
          <span class="footer-status"><i></i> AVAILABLE FOR OPPORTUNITIES</span>
          <span class="footer-location">SHANGHAI · CHINA</span>
        </div>
      </main>

      <span id="modal-anchor" class="modal-anchor" aria-hidden="true"></span>

      <div class="modal" id="portfolio-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-backdrop" data-close-modal="true"></div>
        <section class="modal-card">
          <div class="modal-topline">
            <span id="modal-kicker">01 / PROJECTS</span>
            <button class="modal-close" id="modal-close" type="button" aria-label="关闭弹窗">×</button>
          </div>
          <div class="modal-heading">
            <h2 id="modal-title">项目经历</h2>
            <p id="modal-intro">把日常的小需求，做成可使用、可理解、可持续的作品。</p>
          </div>
          <div class="modal-scroll" id="modal-content"></div>
          <div class="modal-footer">
            <span>可可孟 / YOURNAME</span>
            <span>STAY CURIOUS.</span>
          </div>
        </section>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
