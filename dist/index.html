<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf6" />
    <meta name="description" content="莫瑶的个人简历网站：测试工程师。" />
    <title>莫瑶 / PORTFOLIO</title>
    <link rel="preload" as="image" href="./assets/封面.webp" fetchpriority="high" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 主画面：封面 + 四张人物状态图热区 -->
    <main class="stage" id="stage" aria-label="个人简历主画面">
      <div class="scene" id="scene">
        <img class="cover" src="./assets/封面.webp" alt="莫瑶个人简历主画面：四张票券分别是项目经历、工作经历、GitHub 项目、技能工具" fetchpriority="high" decoding="async" draggable="false" />

        <img class="state-image state-projects" data-state-image="projects" data-src="./assets/01.webp" data-fallback="./assets/01.png" loading="lazy" decoding="async" alt="" aria-hidden="true" draggable="false" />
        <img class="state-image state-experience" data-state-image="experience" data-src="./assets/02.webp" data-fallback="./assets/02.png" loading="lazy" decoding="async" alt="" aria-hidden="true" draggable="false" />
        <img class="state-image state-github" data-state-image="github" data-src="./assets/03.webp" data-fallback="./assets/03.png" loading="lazy" decoding="async" alt="" aria-hidden="true" draggable="false" />
        <img class="state-image state-skills" data-state-image="skills" data-src="./assets/04.webp" data-fallback="./assets/04.png" loading="lazy" decoding="async" alt="" aria-hidden="true" draggable="false" />

        <button class="hotspot hs-projects" data-ticket="projects" aria-label="01 项目经历：查看详情"></button>
        <button class="hotspot hs-experience" data-ticket="experience" aria-label="02 工作经历：查看详情"></button>
        <button class="hotspot hs-github" data-ticket="github" aria-label="03 GitHub 项目：查看详情"></button>
        <button class="hotspot hs-skills" data-ticket="skills" aria-label="04 技能工具：查看详情"></button>
      </div>

      <!-- 手机端栏目入口 -->
      <nav class="mobile-nav" aria-label="栏目入口">
        <button type="button" data-ticket="projects"><i>01</i>项目经历</button>
        <button type="button" data-ticket="experience"><i>02</i>工作经历</button>
        <button type="button" data-ticket="github"><i>03</i>GitHub</button>
        <button type="button" data-ticket="skills"><i>04</i>技能工具</button>
      </nav>
    </main>

    <!-- 详情弹窗 -->
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <article class="modal-card">
        <header class="modal-head">
          <span class="modal-kicker"><b id="modal-no">01</b><span id="modal-en">PROJECTS</span></span>
          <button class="modal-close" id="modal-close" type="button" aria-label="关闭弹窗">×</button>
        </header>
        <h2 class="modal-title" id="modal-title">项目经历</h2>
        <div class="modal-body" id="modal-body"></div>
        <footer class="modal-foot">
          <span class="modal-barcode" aria-hidden="true"></span>
          <a href="mailto:1643807168@qq.com">1643807168@qq.com ↗</a>
        </footer>
      </article>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
